[pytest]
# Los tests viven junto al código, en carpetas que se importan como scripts
# (`sys.path.insert` de cada fichero) y con nombres repetidos a propósito
# (`test_coherence.py` en modelo y en mrp). El modo `importlib` evita que
# pytest los resuelva como módulos top-level homónimos.
# `pipeline/mrp` usa su propio entorno (pandas, ver pipeline/mrp/requirements.txt)
# y se ejecuta aparte: aquí solo se prueban los módulos del venv principal.
testpaths = pipeline
addopts = --import-mode=importlib -q --ignore=pipeline/mrp
