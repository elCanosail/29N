# Pertenencia editorial a bloques de investidura (29N).
#
# Esta constante es la definición publicada: cambiarla cambia los números de
# `seats.json.bloques` y queda registrada en `cambios.json`. Vive en el repo
# para que cualquiera pueda citarla y reproducir la cifra; no es lógica oculta.
#
# Reglas:
#   - Cada partido del universo modelado pertenece a un bloque o a
#     `fuera_de_bloque`, nunca a los dos ni a ninguno: la suma de bloques más
#     los partidos sueltos tiene que cubrir exactamente MODELED_PARTIES.
#   - `fuera_de_bloque` = partidos que no se alinean con ninguno de los dos
#     bloques en una investidura (se cuentan partido a partido).
#   - La mayoría absoluta del Congreso es 176 de 350 escaños.

version: 1
mayoria_absoluta: 176

bloques:
  izquierda:
    partidos: [PSOE, SUMAR, ERC, EH BILDU, BNG, CUP]
  derecha:
    partidos: [PP, VOX, "NA+", CC]

fuera_de_bloque: [JXCAT, PNV, PACMA]
